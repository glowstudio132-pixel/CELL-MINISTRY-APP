<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
(function () {
  try {
    var saved = localStorage.getItem("ceCampusTheme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Groups — Campus Ministry BLW Zone B</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="responsive.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
</head>
<body>

<div class="app-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="sidebar-brand-row">
      <a href="index.html" class="brand">
        <img src="blw-logo.png" alt="Campus Ministry BLW Zone B" class="brand-logo" /> <span class="brand-text">Campus Ministry BLW Zone B</span>
      </a>
      <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" aria-label="Collapse sidebar" title="Collapse sidebar">
        <i data-lucide="panel-left-close"></i>
      </button>
    </div>
    <div class="side-scroll">
      <div class="side-label">Administration</div>
      <a href="admin-dashboard.html" class="side-link" title="Dashboard"><i data-lucide="layout-dashboard"></i><span class="link-text">Dashboard</span></a>
      <a href="admin-groups.html" class="side-link" title="Groups"><i data-lucide="network"></i><span class="link-text">Groups</span></a>
      <a href="admin-cells.html" class="side-link soon" title="Cells"><i data-lucide="users-round"></i><span class="link-text">Cells</span></a>
      <a href="admin-leaders.html" class="side-link soon" title="Cell Leaders"><i data-lucide="user-check"></i><span class="link-text">Cell Leaders</span></a>
      <a href="admin-members.html" class="side-link soon" title="Members"><i data-lucide="users"></i><span class="link-text">Members</span></a>
      <a href="admin-attendance.html" class="side-link soon" title="Attendance"><i data-lucide="clipboard-check"></i><span class="link-text">Attendance</span></a>
      <a href="admin-offerings.html" class="side-link soon" title="Offerings"><i data-lucide="hand-coins"></i><span class="link-text">Offerings</span></a>
      <a href="admin-growth.html" class="side-link soon" title="Growth"><i data-lucide="trending-up"></i><span class="link-text">Growth</span></a>
      <a href="admin-activities.html" class="side-link soon" title="Activities"><i data-lucide="calendar-heart"></i><span class="link-text">Activities</span></a>
      <a href="admin-reports.html" class="side-link soon" title="Reports"><i data-lucide="file-text"></i><span class="link-text">Reports</span></a>
      <a href="admin-analytics.html" class="side-link soon" title="Analytics"><i data-lucide="bar-chart-3"></i><span class="link-text">Analytics</span></a>
      <div class="side-label">Account</div>
      <a href="admin-notifications.html" class="side-link soon" title="Notifications"><i data-lucide="bell"></i><span class="link-text">Notifications</span></a>
      <a href="admin-settings.html" class="side-link soon" title="Settings"><i data-lucide="settings"></i><span class="link-text">Settings</span></a>
    </div>
    <div class="side-foot">
      <a href="#" class="side-link" id="logout-link"><i data-lucide="log-out"></i><span class="link-text">Logout</span></a>
    </div>
  </aside>
  <div class="sidebar-overlay"></div>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <div class="topbar">
      <div class="u-flex u-center u-gap-16">
        <button class="menu-toggle" aria-label="Open menu"><span></span><span></span><span></span></button>
        <div class="topbar-title">
          <h1>Groups</h1>
          <p>All ministry groups and their chapters.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <i data-lucide="moon" class="theme-icon-light"></i>
          <i data-lucide="sun" class="theme-icon-dark"></i>
        </button>
        <div id="profile-menu-slot"></div>
      </div>
    </div>

    <div class="page-body">
      <div class="group-grid" id="group-grid"></div>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="admin-dashboard.html" class="bn-item"><i data-lucide="layout-dashboard"></i><span class="link-text">Home</span></a>
    <a href="admin-groups.html" class="bn-item active"><i data-lucide="network"></i><span class="link-text">Groups</span></a>
    <a href="admin-reports.html" class="bn-item soon"><i data-lucide="file-text"></i><span class="link-text">Reports</span></a>
    <a href="admin-analytics.html" class="bn-item soon"><i data-lucide="bar-chart-3"></i><span class="link-text">Analytics</span></a>
    <a href="#" class="bn-item" id="bn-logout"><i data-lucide="log-out"></i> Logout</a>
  </div>
</nav>

<script src="utils.js"></script>
<script src="theme.js"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="components.js"></script>
<script>
  const session = requireRole("administrator");

  document.addEventListener("DOMContentLoaded", () => {
    if (!session) return;

    initProfileMenu("profile-menu-slot", session);

    function goLogout() { confirmAction("Are you sure you want to end your current session?", logout, { title: "Sign out?", confirmLabel: "Sign Out" }); }
    document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); goLogout(); });
    document.getElementById("bn-logout").addEventListener("click", (e) => { e.preventDefault(); goLogout(); });

    document.querySelectorAll(".side-link.soon, .bn-item.soon").forEach(link => {
      link.addEventListener("click", (e) => {
        e.preventDefault();
        showToast("This section isn't available yet.", "success");
      });
    });

    const groups = (session.adminType === "group_admin" && session.groupId)
      ? getGroups().filter(g => g.id === session.groupId)
      : getGroups();
    document.getElementById("group-grid").innerHTML = groups.map(g => {
      const stats = getGroupStats(g.id);
      return `
        <div class="card group-card" onclick="window.location.href='admin-group-detail.html?group=${g.id}'">
          <div class="group-card-top">
            <div class="summary-icon tone-royal"><i data-lucide="network"></i></div>
            <i data-lucide="chevron-right" style="width:18px; height:18px; color:var(--ink-400);"></i>
          </div>
          <h3>${g.name}</h3>
          <p style="font-size:13px;">${stats.chapterCount} chapters</p>
          <div class="group-card-stats">
            <div class="group-stat"><b>${stats.cellCount}</b>Cells</div>
            <div class="group-stat"><b>${stats.memberCount}</b>Members</div>
            <div class="group-stat"><b>${stats.avgAttendance}%</b>Attendance</div>
          </div>
        </div>`;
    }).join("");

    lucide.createIcons();
  });
</script>
</body>
</html>
