<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
(function () {
  try {
    var saved = localStorage.getItem("ceCampusTheme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — Campus Ministry BLW Zone B</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="responsive.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
/* ===== Seamless background (fixes the visible "seam" on phones) =====
   The page box used to end before the screen did, leaving a flat strip below it when the
   phone's toolbars hide. The page colour now fills the whole screen and the corner glows
   are fixed to the screen instead of the page box. */
html { background-color: var(--paper-50); }
body { overflow-x: clip; }
.auth-page { min-height: 100vh; min-height: 100dvh; overflow: visible; }
.auth-page::before, .auth-page::after { position: fixed; }
</style>
</head>
<body>

<div class="auth-page">
  <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" style="position:absolute; top:24px; right:24px; z-index:2;">
    <i data-lucide="moon" class="theme-icon-light"></i>
    <i data-lucide="sun" class="theme-icon-dark"></i>
  </button>

  <div class="auth-card-wrap" style="max-width:440px;">
    <div class="auth-top">
      <div class="auth-icon"><img src="blw-logo.png" alt="Campus Ministry BLW Zone B" /></div>
      <h1>Create your account</h1>
      <p>Register your cell to get your Campus Ministry BLW Zone B workspace. Administrators are invited, so they just sign in.</p>
    </div>

    <div class="card auth-card" style="padding:28px;">
      <div class="form-error" id="form-error"></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Full Name</label>
          <input class="input" type="text" id="name" autocomplete="name" />
          <span class="field-hint field-error" id="name-error"></span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" autocomplete="email" />
          <span class="field-hint field-error" id="email-error"></span>
        </div>

        <div id="leader-fields">
          <div class="field">
            <label for="group">Group</label>
            <select class="select" id="group">
              <option value="">Select a group</option>
            </select>
            <span class="field-hint field-error" id="group-error"></span>
          </div>
          <div class="field">
            <label for="chapter">Chapter</label>
            <select class="select" id="chapter" disabled>
              <option value="">Select a group first</option>
            </select>
            <span class="field-hint field-error" id="chapter-error"></span>
          </div>
          <div class="field">
            <label for="cellName">Cell Name</label>
            <input class="input" type="text" id="cellName" placeholder="e.g. Grace Cell" />
            <span class="field-hint field-error" id="cellName-error"></span>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input class="input" type="password" id="password" autocomplete="new-password" style="padding-right:42px;" />
            <button type="button" class="password-toggle" data-target="password" aria-label="Show password"><i data-lucide="eye"></i></button>
          </div>
          <span class="field-hint field-error" id="password-error"></span>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-field">
            <input class="input" type="password" id="confirmPassword" autocomplete="new-password" style="padding-right:42px;" />
            <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password"><i data-lucide="eye"></i></button>
          </div>
          <span class="field-hint field-error" id="confirmPassword-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="register-btn" style="margin-top:6px;">
          <span class="btn-spinner"></span>
          <i data-lucide="user-plus" class="btn-label-icon"></i>
          <span class="btn-label-text">Create Account</span>
        </button>
      </form>

      <div class="auth-divider">OR</div>
      <button type="button" class="btn btn-google btn-block" id="google-btn">
        <svg class="google-g" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.8-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.4 26.9 37 24 37c-5.2 0-9.6-3.3-11.2-8l-6.6 5.1C9.6 40.6 16.3 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.6 5.4C41.5 35.9 45 30.4 45 24c0-1.4-.1-2.8-.4-3.5z"/></svg>
        Sign up with Google
      </button>
      <p style="font-size:12px; color:var(--ink-500); text-align:center; margin-top:10px;">With Google you'll choose your group, chapter and cell on the next step.</p>

      <p class="auth-foot">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="utils.js"></script>
<script src="theme.js"></script>
<script src="data.js"></script>
<script src="auth.js"></script>
<script>
  const groupSelect = document.getElementById("group");
  const chapterSelect = document.getElementById("chapter");
  const formError = document.getElementById("form-error");
  const registerBtn = document.getElementById("register-btn");
  const googleBtn = document.getElementById("google-btn");

  function showError(message) { formError.textContent = message; formError.classList.add("show"); }
  function setBusy(busy, text) {
    registerBtn.classList.toggle("is-loading", busy);
    registerBtn.disabled = busy; googleBtn.disabled = busy;
    registerBtn.querySelector(".btn-label-text").textContent = text || "Create Account";
  }

  /* Groups and chapters come from the database (public reference data). */
  (async () => {
    try {
      await loadReferenceData();
      getGroups().forEach(g => {
        const opt = document.createElement("option");
        opt.value = g.id; opt.textContent = g.name;
        groupSelect.appendChild(opt);
      });
    } catch (err) { showError(err.message); }
  })();

  groupSelect.addEventListener("change", () => {
    chapterSelect.innerHTML = "";
    if (!groupSelect.value) {
      chapterSelect.disabled = true;
      chapterSelect.innerHTML = '<option value="">Select a group first</option>';
      return;
    }
    chapterSelect.disabled = false;
    chapterSelect.innerHTML = '<option value="">Select a chapter</option>' +
      getChapters(groupSelect.value).map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join("");
  });

  document.querySelectorAll(".password-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.getAttribute("data-target"));
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.innerHTML = show ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
      lucide.createIcons();
    });
  });

  function setFieldError(id, message) {
    const el = document.getElementById(id + "-error");
    if (!el) return false;
    el.textContent = message;
    el.style.display = message ? "block" : "none";
    el.style.color = "var(--danger-600)";
    return !!message;
  }

  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    formError.classList.remove("show");
    ["name", "email", "group", "chapter", "cellName", "password", "confirmPassword"].forEach(id => setFieldError(id, ""));

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const cellName = document.getElementById("cellName").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    let hasError = false;
    if (!name) hasError = setFieldError("name", "Please enter your full name.") || hasError;
    if (!email) hasError = setFieldError("email", "Please enter your email.") || hasError;
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) hasError = setFieldError("email", "Please enter a valid email address.") || hasError;
    if (!groupSelect.value) hasError = setFieldError("group", "Please select a group.") || hasError;
    if (!chapterSelect.value) hasError = setFieldError("chapter", "Please select a chapter.") || hasError;
    if (!cellName) hasError = setFieldError("cellName", "Please enter your cell name.") || hasError;
    if (!password) hasError = setFieldError("password", "Please enter a password.") || hasError;
    else if (password.length < 6) hasError = setFieldError("password", "Password must be at least 6 characters.") || hasError;
    if (confirmPassword !== password) hasError = setFieldError("confirmPassword", "Passwords do not match.") || hasError;
    if (hasError) return;

    setBusy(true, "Creating account...");
    try {
      const result = await signUpWithEmail({ email, password, fullName: name, chapterId: chapterSelect.value, cellName });
      if (!result.ok) { setBusy(false); showError(result.message); return; }
      if (result.signedIn) {
        const dest = await routeSignedInUser();
        window.location.replace(dest ? dest.path : "login.html");
        return;
      }
      // Email confirmation is on: the account exists once they click the link we emailed.
      setBusy(false);
      document.getElementById("register-form").style.display = "none";
      formError.classList.remove("show");
      formError.insertAdjacentHTML("afterend", `<div class="card" style="padding:18px; margin-bottom:12px; text-align:center;"><h3 style="margin-bottom:6px;">Check your email</h3><p style="font-size:13.5px; color:var(--ink-500);">We sent a confirmation link to <strong>${escapeHtml(email)}</strong>. Click it, then sign in to open your cell.</p><a href="login.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Go to sign in</a></div>`);
    } catch (err) { setBusy(false); showError(err.message); }
  });

  googleBtn.addEventListener("click", async () => {
    formError.classList.remove("show");
    setBusy(true, "Opening Google...");
    try {
      const result = await signInWithGoogle();
      if (!result.ok) { setBusy(false); showError(result.message); }
    } catch (err) { setBusy(false); showError(err.message); }
  });

  lucide.createIcons();
</script>
</body>
</html>
