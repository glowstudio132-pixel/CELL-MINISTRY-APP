<html lang="en">

<script>
(function () {
  try {
    var saved = localStorage.getItem("ceCampusTheme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
  try { if (localStorage.getItem("ceCampusSidebarCollapsed") === "1") document.documentElement.setAttribute("data-sidebar", "collapsed"); } catch (e) {}
})();
</script>

  <!-- ============ SIDEBAR ============ -->

      </a>
      <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" aria-label="Collapse sidebar" title="Collapse sidebar">
        <i data-lucide="panel-left-close"></i>
      </button>
    </div>
    <div class="side-scroll">
      <div class="side-label">Administration</div>
      <a href="admin-dashboard.html" class="side-link" title="Dashboard"><i data-lucide="layout-dashboard"></i><span class="link-text">Dashboard</span></a>
      <a href="admin-groups.html" class="side-link" title="Groups"><i data-lucide="network"></i><span class="link-text">Groups</span></a>
      <a href="admin-cells.html" class="side-link" title="Cells"><i data-lucide="users-round"></i><span class="link-text">Cells</span></a>
      <a href="admin-leaders.html" class="side-link" title="Cell Leaders"><i data-lucide="user-check"></i><span class="link-text">Cell Leaders</span></a>
      <a href="admin-members.html" class="side-link" title="Members"><i data-lucide="users"></i><span class="link-text">Members</span></a>
      <a href="admin-attendance.html" class="side-link" title="Attendance"><i data-lucide="clipboard-check"></i><span class="link-text">Attendance</span></a>
      <a href="admin-offerings.html" class="side-link" title="Offerings"><i data-lucide="hand-coins"></i><span class="link-text">Offerings</span></a>
      <a href="admin-growth.html" class="side-link" title="Growth"><i data-lucide="trending-up"></i><span class="link-text">Growth</span></a>
      <a href="admin-activities.html" class="side-link" title="Activities"><i data-lucide="calendar-heart"></i><span class="link-text">Activities</span></a>
      <a href="admin-reports.html" class="side-link" title="Reports"><i data-lucide="file-text"></i><span class="link-text">Reports</span></a>
      <a href="admin-analytics.html" class="side-link" title="Analytics"><i data-lucide="bar-chart-3"></i><span class="link-text">Analytics</span></a>
      <div class="side-label">Account</div>
      <a href="admin-notifications.html" class="side-link" title="Notifications"><i data-lucide="bell"></i><span class="link-text">Notifications</span></a>

    <div class="side-foot">
      <a href="#" class="side-link" id="logout-link"><i data-lucide="log-out"></i><span class="link-text">Logout</span></a>
    </div>
  </aside>
  <div class="sidebar-overlay"></div>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <div class="topbar">
      <div class="u-flex u-center u-gap-16">
        <button class="menu-toggle" aria-label="Open menu"><span></span><span></span><span></span></button>
        <div class="topbar-title">
          <h1 id="chapter-title">Chapter</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <i data-lucide="moon" class="theme-icon-light"></i>

        </button>
        <div id="profile-menu-slot"></div>
      </div>
    </div>

    <div class="page-body">

      <div class="panel">
        <div class="panel-head">
          <h3>Cells in this chapter</h3>
          <a href="#" id="manage-cells-link" class="btn btn-secondary btn-sm"><i data-lucide="settings-2" style="width:14px;height:14px;"></i> Manage Cells</a>

      </div>

</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="admin-dashboard.html" class="bn-item"><i data-lucide="layout-dashboard"></i><span class="link-text">Home</span></a>
    <a href="admin-groups.html" class="bn-item"><i data-lucide="network"></i><span class="link-text">Groups</span></a>
    <a href="admin-reports.html" class="bn-item"><i data-lucide="file-text"></i><span class="link-text">Reports</span></a>
    <a href="admin-analytics.html" class="bn-item"><i data-lucide="bar-chart-3"></i><span class="link-text">Analytics</span></a>
    <a href="#" class="bn-item" id="bn-logout" title="Logout"><i data-lucide="log-out"></i><span class="link-text">Logout</span></a>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="utils.js"></script>
<script src="theme.js"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="components.js"></script>
<script>
  let session = null;

  document.addEventListener("DOMContentLoaded", async () => {
    session = await bootPage("administrator", { needs: ["attendance", "members"] });
    if (!session) return;

    initProfileMenu("profile-menu-slot", session);

    function goLogout() { confirmAction("Are you sure you want to end your current session?", logout, { title: "Sign out?", confirmLabel: "Sign Out" }); }
    document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); goLogout(); });
    document.getElementById("bn-logout").addEventListener("click", (e) => { e.preventDefault(); goLogout(); });

    const params = new URLSearchParams(window.location.search);
    const chapterId = params.get("chapter");
    const chapter = chapterId ? getChapterById(chapterId) : null;

    if (!chapter) {
      document.getElementById("chapter-title").textContent = "Chapter not found";
      document.querySelector(".page-body").insertAdjacentHTML("beforeend", `<div class="empty-state"><h4>We couldn't find that chapter</h4><p>Go back and pick a chapter from a group.</p></div>`);
      lucide.createIcons();
      return;
    }

    // A Group Administrator can only view chapters within their own group.
    if (session.adminType === "group_admin" && session.groupId && chapter.groupId !== session.groupId) {
      window.location.href = "admin-group-detail.html?group=" + session.groupId;
      return;
    }

    const group = getGroupById(chapter.groupId);

    document.title = chapter.name + " — Campus Ministry BLW Zone B";
    document.getElementById("chapter-title").textContent = chapter.name;
    document.getElementById("back-to-group").href = "admin-group-detail.html?group=" + chapter.groupId;
    document.getElementById("back-to-group-label").textContent = "Back to " + (group ? group.name : "Group");
    document.getElementById("manage-cells-link").href = "admin-cells.html?chapter=" + chapter.id;

    const cells = getCells(chapter.id);
    const cellIds = cells.map(c => c.id);
    const leaderCount = getLeaders().filter(l => cellIds.includes(l.cellId)).length;
    const memberCount = getMembers().filter(m => cellIds.includes(m.cellId) && m.status === "Active").length;
    const cellsWithAttendance = cells.filter(c => getLatestAttendance(c.id));
    const avgAttendance = cellsWithAttendance.length
      ? Math.round(cellsWithAttendance.reduce((sum, c) => sum + getAttendanceRate(c.id), 0) / cellsWithAttendance.length * 10) / 10
      : 0;

    const cards = [
      { icon: "users-round", tone: "royal", value: cells.length, label: "Cells" },
      { icon: "user-check", tone: "royal", value: leaderCount, label: "Cell Leaders" },
      { icon: "users", tone: "success", value: memberCount, label: "Members" },
      { icon: "trending-up", tone: "success", value: avgAttendance + "%", label: "Attendance" }
    ];
    document.getElementById("summary-grid").innerHTML = cards.map(c => `
      <div class="card summary-card">
        <div class="summary-top"><div class="summary-icon tone-${c.tone}"><i data-lucide="${c.icon}"></i></div></div>
        <div class="summary-value">${c.value}</div>
        <div class="summary-label">${c.label}</div>
      </div>
    `).join("");

    const cellList = document.getElementById("cell-list");
    if (!cells.length) {
      cellList.innerHTML = `<div class="empty-state"><h4>No cells have been added to this chapter yet</h4><a href="admin-cells.html?chapter=${chapter.id}" class="btn btn-primary btn-sm" style="margin-top:14px;">+ Add Cell</a></div>`;
    } else {
      cellList.innerHTML = cells.map(c => {
        const leader = getLeaderById(c.leaderId);
        const memberCountForCell = getMembers(c.id).filter(m => m.status === "Active").length;
        return `
          <div class="chapter-row" onclick="window.location.href='admin-cells.html?chapter=${chapter.id}'">
            <div class="chapter-row-name">
              <div class="chapter-icon"><i data-lucide="users-round"></i></div>
              ${c.name}
            </div>
            <div class="u-flex u-gap-12 u-center">
              <span class="badge badge-dot ${statusBadgeClass(c.status)}">${c.status}</span>
              <span class="chapter-row-meta">${leader ? leader.name : "Unassigned"} · ${memberCountForCell} members</span>
            </div>
          </div>`;
      }).join("");
    }

    lucide.createIcons();
  });
</script>
</body>
</html>
