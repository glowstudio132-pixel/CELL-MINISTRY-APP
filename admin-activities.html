<script>
  let session = null;

  document.addEventListener("DOMContentLoaded", async () => {
    session = await bootPage("administrator", { needs: ["activities", "photos"] });
    if (!session) return;
    initProfileMenu("profile-menu-slot", session);

    function goLogout() { confirmAction("Are you sure you want to end your current session?", logout, { title: "Sign out?", confirmLabel: "Sign Out" }); }
    document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); goLogout(); });
    document.getElementById("bn-logout").addEventListener("click", (e) => { e.preventDefault(); goLogout(); });

    // ---------- Scope: a Group Administrator only sees their own group ----------
    const isGroupAdmin = session.adminType === "group_admin" && session.groupId;
    const scopeGroups = isGroupAdmin ? getGroups().filter(g => g.id === session.groupId) : getGroups();
    const scopeGroupIds = scopeGroups.map(g => g.id);
    const scopeChapters = getChapters().filter(ch => scopeGroupIds.includes(ch.groupId));
    const scopeChapterIds = scopeChapters.map(ch => ch.id);
    const scopeCells = getCells().filter(c => scopeChapterIds.includes(c.chapterId));
    const scopeCellIds = scopeCells.map(c => c.id);
    const scopeLeaders = getLeaders().filter(l => scopeCellIds.includes(l.cellId));
    const scopeMembers = getMembers().filter(m => scopeCellIds.includes(m.cellId));
    const scopeOfferings = getOfferings().filter(o => scopeCellIds.includes(o.cellId));
    const scopeActivities = getActivities().filter(a => scopeCellIds.includes(a.cellId));
    const scopeReports = getReports().filter(r => scopeCellIds.includes(r.cellId));

    const allActivities = scopeActivities.map(a => Object.assign({}, a, { cellName: (getCellById(a.cellId) || {}).name || "—" }))
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    const grid = document.getElementById("activities-grid");
    if (!allActivities.length) {
      grid.innerHTML = `<div class="card" style="grid-column:1/-1;"><div class="empty-state"><h4>No activities recorded yet</h4><p>Activities logged by cell leaders will show up here.</p></div></div>`;
    } else {
      grid.innerHTML = allActivities.map(a => {
        const photos = a.photos || [];
        const strip = photos.length ? `<div style="display:grid; grid-template-columns:repeat(${photos.length}, 1fr); gap:6px; margin-bottom:12px;">` + photos.map((p, i) => `
          <div style="aspect-ratio:1; border-radius:8px; overflow:hidden; background:var(--line-200);">
            <img src="${p.src}" alt="Activity photo" data-view="${a.id}:${i}" style="width:100%; height:100%; object-fit:cover; cursor:zoom-in; display:block;" />
          </div>`).join("") + `</div>` : "";
        return `
        <div class="card" style="padding:20px;">
          ${strip}
          <span class="badge badge-pending" style="margin-bottom:10px;">${escapeHtml(a.category)}</span>
          <h4 style="font-size:15px; margin-bottom:6px;">${escapeHtml(a.name)}</h4>
          <p style="font-size:13px; margin-bottom:10px; color:var(--ink-500);">${escapeHtml(a.cellName)}</p>
          <div style="font-size:12.5px; color:var(--ink-500);">${formatDate(a.date)} · ${a.participants || 0} participants${photos.length ? " · " + photos.length + " photo" + (photos.length === 1 ? "" : "s") : ""}</div>
        </div>`;
      }).join("");
      grid.querySelectorAll("[data-view]").forEach(img => img.addEventListener("click", () => {
        const [id, i] = img.dataset.view.split(":"); const a = allActivities.find(x => x.id === id);
        openPhotoViewer(a.photos[+i].src, a.name + " · " + a.cellName);
      }));
    }

    lucide.createIcons();
  });
</script>
