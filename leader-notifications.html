<script src="utils.js"></script>

<script src="auth.js"></script>
<script src="data.js"></script>
<script src="components.js"></script>

<script>
  const session = requireRole("cell_leader");
  const cellId = session ? (session.cellId || null) : null;

  document.addEventListener("DOMContentLoaded", () => {
    if (!session) return;
    initProfileMenu("profile-menu-slot", session);

    function goLogout() { confirmAction("Are you sure you want to end your current session?", logout, { title: "Sign out?", confirmLabel: "Sign Out" }); }
    document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); goLogout(); });
    document.getElementById("bn-logout").addEventListener("click", (e) => { e.preventDefault(); goLogout(); });

    if (!cellId) {
      const banner = document.getElementById("no-cell-banner");
      if (banner) banner.style.display = "block";
    }

    const notifications = [];
    if (!cellId) {
      notifications.push({ icon: "info", tone: "royal", text: "No cell is linked to your account yet.", time: "Now" });
    } else {
      const reportsList = getReports(cellId);
      const latestReport = reportsList[0];
      const thisWeekStr = new Date().toISOString().slice(0, 10);
      if (!latestReport || latestReport.weekOf !== thisWeekStr) {
        notifications.push({ icon: "file-text", tone: "gold", text: "Your weekly report is due.", time: "This week" });
      }
      const latestAttendance = getLatestAttendance(cellId);
      if (!latestAttendance) {
        notifications.push({ icon: "clipboard-check", tone: "royal", text: "Attendance hasn't been recorded for this cell yet.", time: "This week" });
      }
      const members = getMembers(cellId);
      if (members.length) {
        notifications.push({ icon: "users", tone: "success", text: `Your cell now has ${members.length} member${members.length === 1 ? "" : "s"}.`, time: "Recently" });
      }
      const activities = getActivities(cellId);
      if (activities.length) {
        notifications.push({ icon: "calendar-heart", tone: "success", text: `Latest activity: ${activities[0].name}.`, time: formatDate(activities[0].date) });
      }
    }
    if (!notifications.length) {
      notifications.push({ icon: "check", tone: "success", text: "You're all caught up.", time: "Now" });
    }

    document.getElementById("notif-list").innerHTML = notifications.map(n => `
      <div class="card" style="padding:16px; display:flex; align-items:center; gap:14px;">
        <div class="summary-icon tone-${n.tone}"><i data-lucide="${n.icon}"></i></div>
        <div style="flex:1;">
          <p style="font-size:13.5px; font-weight:500; color:var(--ink-900); margin:0;">${n.text}</p>
          <p style="font-size:11.5px; color:var(--ink-400); margin:2px 0 0;">${n.time}</p>
        </div>
      </div>
    `).join("");

    lucide.createIcons();
  });
</script>
</body>
</html>
