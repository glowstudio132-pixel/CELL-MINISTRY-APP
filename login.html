<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
(function () {
  try {
    var saved = localStorage.getItem("ceCampusTheme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Campus Ministry BLW Zone B</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="responsive.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
/* ===== Login: floating gradient background, glass card ===== */
.auth-page {
  position: relative; overflow: hidden;
  background:
    radial-gradient(60% 55% at 12% 8%, color-mix(in srgb, var(--royal-500) 8%, transparent), transparent 70%),
    radial-gradient(55% 50% at 92% 92%, color-mix(in srgb, var(--violet-500) 8%, transparent), transparent 70%),
    linear-gradient(160deg, var(--paper-50), color-mix(in srgb, var(--royal-500) 3%, var(--paper-50)));
}
.bg-blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .22; pointer-events: none; animation: blob-drift 14s ease-in-out infinite; }
.bg-blob.b1 { width: 340px; height: 340px; top: -90px; left: -80px; background: var(--royal-500); }
.bg-blob.b2 { width: 280px; height: 280px; bottom: -70px; right: -60px; background: var(--violet-500); animation-delay: -4s; }
.bg-blob.b3 { width: 200px; height: 200px; top: 55%; left: 8%; background: color-mix(in srgb, var(--royal-600) 70%, #7fb4ff); opacity: .14; animation-delay: -8s; }
.bg-blob.b4 { width: 180px; height: 180px; top: 10%; right: 12%; background: color-mix(in srgb, var(--violet-500) 60%, #7fb4ff); opacity: .14; animation-delay: -11s; }
@keyframes blob-drift { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(40px,-30px) scale(1.1); } 66% { transform: translate(-30px,30px) scale(.95); } }

.auth-card-wrap { position: relative; z-index: 1; animation: card-rise .6s ease both; }
@keyframes card-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.card.auth-card {
  background: linear-gradient(145deg, color-mix(in srgb, var(--paper-0) 78%, transparent), color-mix(in srgb, var(--paper-0) 46%, transparent));
  border: 1px solid rgba(255,255,255,.55);
  box-shadow: 0 24px 60px rgba(16,20,43,.14), inset 0 1px 0 rgba(255,255,255,.7);
  -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
}
:root[data-theme="dark"] .card.auth-card { border-color: rgba(255,255,255,.12); box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12); }
.auth-card .input { background: color-mix(in srgb, var(--paper-0) 55%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: border-color .2s ease, box-shadow .2s ease, background .2s ease; }
.auth-card .input:focus { border-color: var(--royal-500); box-shadow: 0 0 0 4px color-mix(in srgb, var(--royal-500) 22%, transparent); background: color-mix(in srgb, var(--paper-0) 80%, transparent); }

.role-select-row .role-option { transition: transform .2s ease, background .25s ease, box-shadow .25s ease, color .2s ease, border-color .25s ease; }
.role-select-row .role-option:hover { transform: translateY(-2px); }
.role-select-row .role-option.active { color: #fff; border-color: rgba(255,255,255,.3); background: linear-gradient(135deg, rgba(104,120,255,.95), rgba(51,70,214,.92) 55%, rgba(39,53,171,.95)); box-shadow: 0 8px 20px rgba(51,70,214,.32), inset 0 1px 0 rgba(255,255,255,.35); }

.btn.btn-google { color: var(--ink-900); background: linear-gradient(135deg, rgba(255,255,255,.75), rgba(255,255,255,.35)); border-color: rgba(77,94,234,.25); box-shadow: 0 6px 18px rgba(16,20,43,.08), inset 0 1px 0 rgba(255,255,255,.8); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.btn.btn-google:hover { border-color: var(--royal-500); box-shadow: 0 12px 26px rgba(51,70,214,.2), inset 0 1px 0 rgba(255,255,255,.8); }
:root[data-theme="dark"] .btn.btn-google { background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); border-color: rgba(255,255,255,.18); }

/* top corner controls */
.back-home { position: absolute; top: 24px; left: 24px; z-index: 2; }
.back-home svg { transition: transform .2s ease; }
.back-home:hover svg { transform: translateX(-3px); }
.auth-page .theme-toggle { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(77,94,234,.25) !important; background: linear-gradient(135deg, rgba(255,255,255,.7), rgba(255,255,255,.3)) !important; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 6px 18px rgba(16,20,43,.1); transition: transform .2s ease, box-shadow .2s ease; }
.auth-page .theme-toggle:hover { transform: translateY(-2px) rotate(12deg); box-shadow: 0 12px 24px rgba(51,70,214,.2); }
:root[data-theme="dark"] .auth-page .theme-toggle { background: rgba(255,255,255,.1) !important; border-color: rgba(255,255,255,.18) !important; }
@media (max-width: 560px) { .back-home, .auth-page .theme-toggle { top: 16px !important; } .back-home { left: 16px; } .auth-page .theme-toggle { right: 16px !important; } .auth-card-wrap { margin-top: 48px; } }
@media (prefers-reduced-motion: reduce) { .bg-blob, 
/* ===== Seamless background (fixes the visible "seam" on phones) =====
   The colours used to belong to the page box, so on phones the area below the page
   (when the browser toolbars hide) showed a flat colour. They now belong to the whole
   screen: a fixed layer behind everything, so it always fills the viewport. */
html { background-color: var(--paper-50); }
body { background: transparent; overflow-x: clip; }
body::before {
  content: ""; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60% 55% at 12% 8%, color-mix(in srgb, var(--royal-500) 8%, transparent), transparent 70%),
    radial-gradient(55% 50% at 92% 92%, color-mix(in srgb, var(--violet-500) 8%, transparent), transparent 70%),
    linear-gradient(160deg, var(--paper-50), color-mix(in srgb, var(--royal-500) 3%, var(--paper-50)));
}
.auth-page { background: none; min-height: 100vh; min-height: 100dvh; overflow: visible; }
.auth-page::before, .auth-page::after, .bg-blob { position: fixed; }
</style>
</head>
<body>

<div class="auth-page">
  <span class="bg-blob b1"></span><span class="bg-blob b2"></span><span class="bg-blob b3"></span><span class="bg-blob b4"></span>





  <a href="index.html" class="btn btn-secondary btn-sm back-home"><i data-lucide="arrow-left"></i> Back to home</a>
  <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" style="position:absolute; top:24px; right:24px; z-index:2;">
    <i data-lucide="moon" class="theme-icon-light"></i>
    <i data-lucide="sun" class="theme-icon-dark"></i>
  </button>

  <div class="auth-card-wrap">
    <div class="auth-top">
      <div class="auth-icon"><img src="blw-logo.png" alt="Campus Ministry BLW Zone B" /></div>
      <h1>Welcome back</h1>
      <p>Sign in with your email or Google to continue.</p>
    </div>

    <div class="card auth-card" style="padding:28px;">
      <div class="form-error" id="form-error"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" autocomplete="email" />
          <span class="field-hint" id="email-error" style="display:none; color:var(--danger-600);"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input class="input" type="password" id="password" autocomplete="current-password" style="padding-right:42px;" />
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <span class="field-hint" id="password-error" style="display:none; color:var(--danger-600);"></span>
        </div>
        <div class="auth-row">
          <span></span>
          <a href="#" style="color:var(--royal-600); font-weight:600;" id="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="signin-btn">
          <span class="btn-spinner"></span>
          <i data-lucide="log-in" class="btn-label-icon"></i>
          <span class="btn-label-text">Sign In</span>
        </button>
      </form>

      <div class="auth-divider">OR</div>

      <button type="button" class="btn btn-google btn-block" id="google-btn">
        <svg class="google-g" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.8-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.4 26.9 37 24 37c-5.2 0-9.6-3.3-11.2-8l-6.6 5.1C9.6 40.6 16.3 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.6 5.4C41.5 35.9 45 30.4 45 24c0-1.4-.1-2.8-.4-3.5z"/></svg>
        Continue with Google
      </button>

      <p class="auth-foot">Don't have an account? <a href="register.html">Create account</a></p>
    </div>
  </div>
</div>

<!-- ---------- Forgot password modal ---------- -->
<div class="modal-overlay hidden" id="forgot-modal">
  <div class="modal" style="max-width:380px;">
    <div class="modal-header">
      <h3 style="font-size:16px;">Forgot password</h3>
      <button class="modal-close" onclick="closeModal('forgot-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <p style="margin-bottom:14px;">Enter your email and we'll send you a link to choose a new password.</p>
      <div class="field"><label for="forgot-email">Email</label><input class="input" type="email" id="forgot-email" autocomplete="email" /></div>
      <button class="btn btn-primary btn-block" id="forgot-send">Send reset link</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="utils.js"></script>
<script src="theme.js"></script>
<script src="data.js"></script>
<script src="auth.js"></script>
<script>
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const errorBox = document.getElementById("form-error");
  const emailError = document.getElementById("email-error");
  const passwordError = document.getElementById("password-error");
  const signinBtn = document.getElementById("signin-btn");
  const googleBtn = document.getElementById("google-btn");
  const labelEl = signinBtn.querySelector(".btn-label-text");

  function showError(message) { errorBox.textContent = message; errorBox.classList.add("show"); }
  function setBusy(busy, text) {
    signinBtn.classList.toggle("is-loading", busy);
    signinBtn.disabled = busy; googleBtn.disabled = busy;
    labelEl.textContent = text || "Sign In";
  }

  document.getElementById("password-toggle").addEventListener("click", () => {
    const btn = document.getElementById("password-toggle");
    const show = passwordInput.type === "password";
    passwordInput.type = show ? "text" : "password";
    btn.innerHTML = show ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
    lucide.createIcons();
  });

  function clearFieldErrors() {
    [emailError, passwordError].forEach(el => { el.style.display = "none"; el.textContent = ""; });
    errorBox.classList.remove("show");
  }

  /* Sends the person where they belong after any sign-in. */
  async function goHome() {
    const dest = await routeSignedInUser();
    if (!dest) { setBusy(false); showError("We couldn't finish signing you in. Please try again."); return; }
    window.location.replace(dest.path);
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearFieldErrors();
    let hasError = false;
    if (!emailInput.value.trim()) { emailError.textContent = "Please enter your email."; emailError.style.display = "block"; hasError = true; }
    if (!passwordInput.value) { passwordError.textContent = "Please enter your password."; passwordError.style.display = "block"; hasError = true; }
    if (hasError) return;

    setBusy(true, "Signing in...");
    try {
      const result = await signInWithPassword(emailInput.value.trim(), passwordInput.value);
      if (!result.ok) { setBusy(false); showError(result.message); return; }
      await goHome();
    } catch (err) { setBusy(false); showError(err.message); }
  });

  googleBtn.addEventListener("click", async () => {
    clearFieldErrors();
    setBusy(true, "Opening Google...");
    try {
      const result = await signInWithGoogle();   // redirects to Google, then back to this page
      if (!result.ok) { setBusy(false); showError(result.message); }
    } catch (err) { setBusy(false); showError(err.message); }
  });

  /* Forgot password */
  document.getElementById("forgot-link").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("forgot-email").value = emailInput.value.trim();
    openModal("forgot-modal");
  });
  document.getElementById("forgot-send").addEventListener("click", async () => {
    const email = document.getElementById("forgot-email").value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast("Please enter a valid email address.", "error"); return; }
    const btn = document.getElementById("forgot-send");
    btn.disabled = true;
    try {
      const r = await sendPasswordReset(email);
      if (!r.ok) { showToast(r.message, "error"); btn.disabled = false; return; }
      closeModal("forgot-modal");
      showToast("If that email has an account, a reset link is on its way.", "success");
    } catch (err) { showToast(err.message, "error"); }
    btn.disabled = false;
  });

  /* Already signed in, or just back from Google / an email confirmation link? */
  (async () => {
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get("error_description")) showError(params.get("error_description"));
      const { data: { session } } = await getSupabase().auth.getSession();
      if (session) { setBusy(true, "Signing you in..."); await goHome(); }
    } catch (err) { showError(err.message); }
  })();

  lucide.createIcons();
</script>
</body>
</html>
