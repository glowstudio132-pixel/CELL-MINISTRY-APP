<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
(function () {
  try {
    var saved = localStorage.getItem("ceCampusTheme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password · Campus Ministry BLW Zone B</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="responsive.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
/* ===== Login: floating gradient background, glass card ===== */
.auth-page {
  position: relative; overflow: hidden;
  background:
    radial-gradient(60% 55% at 12% 8%, color-mix(in srgb, var(--royal-500) 8%, transparent), transparent 70%),
    radial-gradient(55% 50% at 92% 92%, color-mix(in srgb, var(--violet-500) 8%, transparent), transparent 70%),
    linear-gradient(160deg, var(--paper-50), color-mix(in srgb, var(--royal-500) 3%, var(--paper-50)));
}
.bg-blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .22; pointer-events: none; animation: blob-drift 14s ease-in-out infinite; }
.bg-blob.b1 { width: 340px; height: 340px; top: -90px; left: -80px; background: var(--royal-500); }
.bg-blob.b2 { width: 280px; height: 280px; bottom: -70px; right: -60px; background: var(--violet-500); animation-delay: -4s; }
.bg-blob.b3 { width: 200px; height: 200px; top: 55%; left: 8%; background: color-mix(in srgb, var(--royal-600) 70%, #7fb4ff); opacity: .14; animation-delay: -8s; }
.bg-blob.b4 { width: 180px; height: 180px; top: 10%; right: 12%; background: color-mix(in srgb, var(--violet-500) 60%, #7fb4ff); opacity: .14; animation-delay: -11s; }
@keyframes blob-drift { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(40px,-30px) scale(1.1); } 66% { transform: translate(-30px,30px) scale(.95); } }

.auth-card-wrap { position: relative; z-index: 1; animation: card-rise .6s ease both; }
@keyframes card-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.card.auth-card {
  background: linear-gradient(145deg, color-mix(in srgb, var(--paper-0) 78%, transparent), color-mix(in srgb, var(--paper-0) 46%, transparent));
  border: 1px solid rgba(255,255,255,.55);
  box-shadow: 0 24px 60px rgba(16,20,43,.14), inset 0 1px 0 rgba(255,255,255,.7);
  -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
}
:root[data-theme="dark"] .card.auth-card { border-color: rgba(255,255,255,.12); box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12); }
.auth-card .input { background: color-mix(in srgb, var(--paper-0) 55%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: border-color .2s ease, box-shadow .2s ease, background .2s ease; }
.auth-card .input:focus { border-color: var(--royal-500); box-shadow: 0 0 0 4px color-mix(in srgb, var(--royal-500) 22%, transparent); background: color-mix(in srgb, var(--paper-0) 80%, transparent); }

.role-select-row .role-option { transition: transform .2s ease, background .25s ease, box-shadow .25s ease, color .2s ease, border-color .25s ease; }
.role-select-row .role-option:hover { transform: translateY(-2px); }
.role-select-row .role-option.active { color: #fff; border-color: rgba(255,255,255,.3); background: linear-gradient(135deg, rgba(104,120,255,.95), rgba(51,70,214,.92) 55%, rgba(39,53,171,.95)); box-shadow: 0 8px 20px rgba(51,70,214,.32), inset 0 1px 0 rgba(255,255,255,.35); }

.btn.btn-google { color: var(--ink-900); background: linear-gradient(135deg, rgba(255,255,255,.75), rgba(255,255,255,.35)); border-color: rgba(77,94,234,.25); box-shadow: 0 6px 18px rgba(16,20,43,.08), inset 0 1px 0 rgba(255,255,255,.8); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.btn.btn-google:hover { border-color: var(--royal-500); box-shadow: 0 12px 26px rgba(51,70,214,.2), inset 0 1px 0 rgba(255,255,255,.8); }
:root[data-theme="dark"] .btn.btn-google { background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); border-color: rgba(255,255,255,.18); }

/* top corner controls */
.back-home { position: absolute; top: 24px; left: 24px; z-index: 2; }
.back-home svg { transition: transform .2s ease; }
.back-home:hover svg { transform: translateX(-3px); }
.auth-page .theme-toggle { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(77,94,234,.25) !important; background: linear-gradient(135deg, rgba(255,255,255,.7), rgba(255,255,255,.3)) !important; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 6px 18px rgba(16,20,43,.1); transition: transform .2s ease, box-shadow .2s ease; }
.auth-page .theme-toggle:hover { transform: translateY(-2px) rotate(12deg); box-shadow: 0 12px 24px rgba(51,70,214,.2); }
:root[data-theme="dark"] .auth-page .theme-toggle { background: rgba(255,255,255,.1) !important; border-color: rgba(255,255,255,.18) !important; }
@media (max-width: 560px) { .back-home, .auth-page .theme-toggle { top: 16px !important; } .back-home { left: 16px; } .auth-page .theme-toggle { right: 16px !important; } .auth-card-wrap { margin-top: 48px; } }
@media (prefers-reduced-motion: reduce) { .bg-blob, </style>
</head>
<body>

<div class="auth-page">
  <span class="bg-blob b1"></span><span class="bg-blob b2"></span><span class="bg-blob b3"></span><span class="bg-blob b4"></span>





  <a href="index.html" class="btn btn-secondary btn-sm back-home"><i data-lucide="arrow-left"></i> Back to home</a>
  <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" style="position:absolute; top:24px; right:24px; z-index:2;">
    <i data-lucide="moon" class="theme-icon-light"></i>
    <i data-lucide="sun" class="theme-icon-dark"></i>
  </button>

  <div class="auth-card-wrap">
    <div class="auth-top">
      <div class="auth-icon"><img src="blw-logo.png" alt="Campus Ministry BLW Zone B" /></div>
      <h1>Choose a new password</h1>
      <p>Enter a new password for your account.</p>
    </div>

    <div class="card auth-card" style="padding:28px;">
      <div class="form-error" id="form-error"></div>
      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input class="input" type="password" id="password" autocomplete="new-password" />
          <span class="field-hint" id="password-error" style="display:none; color:var(--danger-600);"></span>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input class="input" type="password" id="confirm" autocomplete="new-password" />
          <span class="field-hint" id="confirm-error" style="display:none; color:var(--danger-600);"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-btn">
          <span class="btn-spinner"></span>
          <i data-lucide="key-round" class="btn-label-icon"></i>
          <span class="btn-label-text">Save new password</span>
        </button>
      </form>
      <p class="auth-foot"><a href="login.html">Back to sign in</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="utils.js"></script>
<script src="theme.js"></script>
<script src="data.js"></script>
<script src="auth.js"></script>
<script>
  const errorBox = document.getElementById("form-error");
  const form = document.getElementById("reset-form");
  const btn = document.getElementById("reset-btn");
  function fieldError(id, msg) { const el = document.getElementById(id + "-error"); el.textContent = msg; el.style.display = msg ? "block" : "none"; return !!msg; }
  function showError(m) { errorBox.textContent = m; errorBox.classList.add("show"); }

  /* The emailed link signs the person in temporarily; without it there is nothing to reset. */
  (async () => {
    try {
      const { data: { session } } = await getSupabase().auth.getSession();
      if (!session) { form.style.display = "none"; showError("This reset link is invalid or has expired. Please request a new one from the sign-in page."); }
    } catch (err) { form.style.display = "none"; showError(err.message); }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    const pw = document.getElementById("password").value, cf = document.getElementById("confirm").value;
    let bad = fieldError("password", pw.length < 6 ? "Password must be at least 6 characters." : "");
    bad = fieldError("confirm", cf !== pw ? "Passwords do not match." : "") || bad;
    if (bad) return;
    btn.disabled = true; btn.classList.add("is-loading");
    try {
      const { error } = await getSupabase().auth.updateUser({ password: pw });
      if (error) throw new Error(friendlyAuthError(error));
      showToast("Password updated.", "success");
      const dest = await routeSignedInUser();
      setTimeout(() => window.location.replace(dest ? dest.path : "login.html"), 700);
    } catch (err) { btn.disabled = false; btn.classList.remove("is-loading"); showError(err.message); }
  });
  lucide.createIcons();
</script>
</body>
</html>
